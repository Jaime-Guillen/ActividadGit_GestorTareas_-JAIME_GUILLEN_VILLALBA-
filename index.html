<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de tareas</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 24px;
      max-width: 900px;
      line-height: 1.6;
    }

    h1 { margin-bottom: 8px; }
    p  { margin-top: 0; color: #444; }

    .panel {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin: 16px 0;
    }

    input[type="text"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      min-width: 260px;
      flex: 1;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      width: 80px;
      height: 40px;
    }

    #btnAdd { background-color: #259c25; color: white; } 
    #btnEdit { background-color: #7967cf; color: white; } 
    #btnDel { background-color: #601712; color: white; } 

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      background-color: white; /* Siempre blanco */
    }
    
    /* Sin sombreados ni fondos de color al seleccionar */
    .selected {
      border: 1px solid #333; /* Solo un borde un poco más oscuro */
    }

    .tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: white; /* Fondo blanco */
      color: #333;
      border: 1px solid #ccc; /* Borde sutil */
      justify-self: end;
    }

    .muted { color: #777; font-size: 14px; }
    .danger { color: #b71c1c; font-weight: bold; }
    .ok { color: #1b5e20; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Gestor de tareas</h1>
  <p class="muted">Plantilla base para la actividad de Git. Completa las funciones marcadas como TODO.</p>

  <div class="panel">
    <input id="taskInput" type="text" placeholder="Escribe una tarea..." />
    <button id="btnAdd" onclick="addTask()">Añadir tarea</button>
    <button id="btnEdit" onclick="editSelected()">Editar tarea</button>
    <button id="btnDel" onclick="deleteSelected()">Eliminar tarea</button>
  </div>

  <ul id="taskList"></ul>

  <p id="status" class="muted"></p>

  <script>
    let tasks = [
      { id: 1, text: "Ejemplo: Clonar repositorio", done: false },
      { id: 2, text: "Ejemplo: Crear rama y hacer commits", done: false }
    ];

    let selectedId = null;
    let nextId = 3;

    function setStatus(message, type = "muted") {
      const el = document.getElementById("status");
      el.className = type;
      el.textContent = message;
    }

    function render() {
      const list = document.getElementById("taskList");
      list.innerHTML = "";

      if (tasks.length === 0) {
        list.innerHTML = `<li><span class="muted">No hay tareas.</span></li>`;
        return;
      }

      tasks.forEach(t => {
        const li = document.createElement("li");
        if (t.id === selectedId) li.classList.add("selected");

        const text = document.createElement("span");
        text.textContent = t.text;

        const small = document.createElement("span");
        small.className = "muted";
        small.textContent = `ID: ${t.id}`;

        const tag = document.createElement("span");
        if (t.id === selectedId) {
            tag.className = "tag";
            tag.textContent = "✓ Seleccionada";
        }

        li.appendChild(text);
        li.appendChild(small);
        li.appendChild(tag);

        li.onclick = () => {
          selectedId = t.id;
          setStatus(`Tarea ID ${selectedId} marcada.`, "ok");
          render();
        };

        list.appendChild(li);
      });
    }

    function readInputTrimmed() {
      return document.getElementById("taskInput").value.trim();
    }

    function clearInput() {
      document.getElementById("taskInput").value = "";
    }

    function addTask() {
      const text = readInputTrimmed();
      if (text === "") {
        setStatus("Error: Escribe una tarea.", "danger");
        return;
      }
      tasks.push({ id: nextId++, text: text, done: false });
      clearInput();
      setStatus("Tarea añadida.", "ok");
      render();
    }

    function deleteSelected() {
      if (selectedId === null) {
        setStatus("Error: Selecciona una tarea primero.", "danger");
        return;
      }
      tasks = tasks.filter(t => t.id !== selectedId);
      setStatus("Tarea eliminada.", "ok");
      selectedId = null;
      render();
    }

    function editSelected() {
      if (selectedId === null) {
        setStatus("Error: Selecciona una tarea primero.", "danger");
        return;
      }
      const task = tasks.find(t => t.id === selectedId);
      let newText = readInputTrimmed() || prompt("Nuevo texto:", task.text);

      if (newText !== null && newText.trim() !== "") {
        task.text = newText.trim();
        clearInput();
        setStatus("Tarea actualizada.", "ok");
        render();
      }
    }

    render();
  </script>
</body>
</html>
